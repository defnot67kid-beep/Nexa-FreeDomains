<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexa · Sign Up · Free Domains</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0a192f 0%, #1a2f4f 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: rgba(10, 25, 47, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            padding: 0.9rem 2.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(59,130,246,0.2);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            background: #3b82f6;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.4rem;
            box-shadow: 0 6px 12px rgba(59,130,246,0.3);
        }

        .logo-text {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            color: white;
        }
        .logo-text span {
            color: #3b82f6;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: #ccd6f6;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.05rem;
            transition: 0.2s ease;
        }

        .nav-links a:hover {
            color: white;
        }

        .main-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border-radius: 42px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.05) inset;
            max-width: 500px;
            width: 100%;
            padding: 2.8rem 2.5rem;
            border: 1px solid rgba(59,130,246,0.2);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .subtitle {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .badge {
            background: rgba(59,130,246,0.1);
            color: #3b82f6;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            display: inline-block;
            margin: 0 auto 1.5rem;
            border: 1px solid rgba(59,130,246,0.3);
            text-align: center;
            width: fit-content;
        }

        .toggle-btns {
            display: flex;
            gap: 10px;
            background: rgba(255,255,255,0.05);
            padding: 5px;
            border-radius: 50px;
            margin-bottom: 2rem;
        }

        .toggle-btn {
            flex: 1;
            text-align: center;
            padding: 0.8rem 0;
            font-weight: 600;
            border-radius: 50px;
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            color: #94a3b8;
            transition: 0.2s;
        }

        .toggle-btn.active {
            background: #3b82f6;
            color: white;
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
        }

        .input-group label {
            color: #ccd6f6;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .input-field {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.05);
            border-radius: 60px;
            padding: 0.1rem 1.2rem;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.2s;
        }

        .input-field:focus-within {
            border-color: #3b82f6;
            background: rgba(255,255,255,0.08);
        }

        .input-field i {
            color: #64748b;
            width: 20px;
        }

        .input-field input {
            width: 100%;
            padding: 0.9rem 0.5rem 0.9rem 0.8rem;
            border: none;
            background: transparent;
            font-size: 1rem;
            outline: none;
            color: white;
        }

        .input-field input::placeholder {
            color: #475569;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.15s;
            width: 100%;
            margin: 1.5rem 0 1rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: scale(1.02);
        }

        .btn-google {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 1rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.15s;
            width: 100%;
        }

        .btn-google:hover {
            background: rgba(255,255,255,0.15);
            border-color: #3b82f6;
        }

        .btn-google i {
            color: #3b82f6;
            font-size: 1.2rem;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #64748b;
            margin: 1.5rem 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }

        .footer-message {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #64748b;
            text-align: center;
        }

        .footer-message a {
            color: #3b82f6;
            text-decoration: none;
        }

        #nameFieldGroup {
            display: flex;
            flex-direction: column;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 0.3rem;
            padding-left: 1rem;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo-area">
        <div class="logo-icon"><i class="fas fa-globe"></i></div>
        <div class="logo-text">Nexa<span>FreeDomains</span></div>
    </div>
    <div class="nav-links">
        <a href="#"><i class="fas fa-home"></i> Home</a>
        <a href="#"><i class="fas fa-headset"></i> Support</a>
    </div>
</nav>

<div class="main-container">
    <div class="glass-card">
        <div style="display: flex; justify-content: center;">
            <span class="badge"><i class="fas fa-infinity"></i>  join 12k+ creators  </span>
        </div>
        <h1>Get Started</h1>
        <p class="subtitle">Create your account to claim your free domain</p>

        <div class="toggle-btns" id="toggleContainer">
            <button class="toggle-btn active" id="toggleSignup">Sign up</button>
            <button class="toggle-btn" id="toggleSignin">Sign in</button>
        </div>

        <form id="authForm">
            <div id="nameFieldGroup">
                <div class="input-group">
                    <label><i class="fas fa-user"></i> Full name</label>
                    <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input type="text" id="nameInput" placeholder="Enter your full name" autocomplete="name">
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label><i class="fas fa-envelope"></i> Email address</label>
                <div class="input-field">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="emailInput" placeholder="hello@example.com" required autocomplete="email">
                </div>
            </div>

            <div class="input-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <div class="input-field">
                    <i class="fas fa-key"></i>
                    <input type="password" id="passwordInput" placeholder="•••••••• (min. 6 characters)" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">
                <i class="fas fa-paper-plane"></i> <span id="submitBtnText">Create account</span>
            </button>
        </form>

        <div class="divider">
            <span class="divider-line"></span>
            <span>or</span>
            <span class="divider-line"></span>
        </div>

        <button class="btn-google" id="googleSignInBtn">
            <i class="fab fa-google"></i> Continue with Google
        </button>

        <div class="footer-message">
            <i class="fas fa-shield-alt"></i>  Secure & encrypted · <a href="#">Terms</a> · <a href="#">Privacy</a>
        </div>
    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { 
        getAuth, 
        signInWithEmailAndPassword, 
        createUserWithEmailAndPassword, 
        updateProfile, 
        signInWithPopup, 
        GoogleAuthProvider,
        onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAupBkllyicDPD9O6CmX4mS4sF5z96mqxc",
        authDomain: "vertexpaste.firebaseapp.com",
        projectId: "vertexpaste",
        storageBucket: "vertexpaste.firebasestorage.app",
        messagingSenderId: "255275350380",
        appId: "1:255275350380:web:7be4e8add2cb5b04045b49"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();
    
    // Discord webhook - only sends ONCE per session
    const WEBHOOK_URL = "https://discordapp.com/api/webhooks/1482059165227548682/IrrpYTrV3YuNdKhTz3tIonlzKjsFQC_RzQmFXwjAjwHd_UgFTP-_BRDBRK59goMcVFXf";
    
    // Track if we've already sent webhook this session
    let webhookSent = false;

    // DOM elements
    const toggleSignup = document.getElementById('toggleSignup');
    const toggleSignin = document.getElementById('toggleSignin');
    const nameFieldGroup = document.getElementById('nameFieldGroup');
    const submitBtnText = document.getElementById('submitBtnText');
    const authForm = document.getElementById('authForm');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const nameInput = document.getElementById('nameInput');
    const googleBtn = document.getElementById('googleSignInBtn');

    let currentMode = 'signup';

    function setMode(mode) {
        currentMode = mode;
        if (mode === 'signup') {
            toggleSignup.classList.add('active');
            toggleSignin.classList.remove('active');
            nameFieldGroup.style.display = 'block';
            submitBtnText.innerText = 'Create account';
            document.getElementById('nameInput').required = false;
        } else {
            toggleSignin.classList.add('active');
            toggleSignup.classList.remove('active');
            nameFieldGroup.style.display = 'none';
            submitBtnText.innerText = 'Sign in';
        }
    }

    toggleSignup.addEventListener('click', (e) => { e.preventDefault(); setMode('signup'); });
    toggleSignin.addEventListener('click', (e) => { e.preventDefault(); setMode('signin'); });
    setMode('signup');

    // Silent Discord send - only once per session
    async function sendToDiscordOnce(payload) {
        if (webhookSent) return;
        try {
            await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            webhookSent = true; // Prevent further sends
        } catch (e) {
            console.log('Discord webhook failed (silent)');
        }
    }

    // Redirect to domain generator after login
    function redirectToGenerator() {
        window.location.href = 'create.html';
    }

    // Handle auth state
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // User is signed in - send ONE webhook and redirect
            if (!webhookSent) {
                sendToDiscordOnce({
                    content: `🔐 **New login**`,
                    embeds: [{
                        title: 'User Authentication',
                        fields: [
                            { name: 'Email', value: user.email || 'No email' },
                            { name: 'Name', value: user.displayName || user.email?.split('@')[0] || 'User' },
                            { name: 'Method', value: user.providerData[0]?.providerId || 'email' }
                        ],
                        color: 5793266,
                        timestamp: new Date().toISOString()
                    }]
                });
            }
            redirectToGenerator();
        }
    });

    // Google sign-in
    googleBtn.addEventListener('click', async () => {
        try {
            await signInWithPopup(auth, googleProvider);
            // Redirect happens via onAuthStateChanged
        } catch (error) {
            alert('Google sign-in error: ' + error.message);
        }
    });

    // Email/password form submit
    authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();
        
        if (!email || !password) {
            alert('Email and password required');
            return;
        }
        
        if (password.length < 6 && currentMode === 'signup') {
            alert('Password must be at least 6 characters');
            return;
        }

        try {
            if (currentMode === 'signup') {
                const fullName = nameInput.value.trim() || email.split('@')[0];
                const userCred = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCred.user, { displayName: fullName });
            } else {
                await signInWithEmailAndPassword(auth, email, password);
            }
            // Clear form
            passwordInput.value = '';
            if (currentMode === 'signup') nameInput.value = '';
            // Redirect handled by onAuthStateChanged
        } catch (error) {
            alert('Error: ' + error.message);
        }
    });

    // Check if already logged in
    if (auth.currentUser) {
        redirectToGenerator();
    }
</script>

</body>
</html>
